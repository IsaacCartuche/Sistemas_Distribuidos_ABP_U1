server:
  port: 8084

spring:
  application:
    name: servicio-usuarios
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-usuarios}:${POSTGRES_PORT:5432}/db_usuarios
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

jwt:
  secret: c3VwZXItc2VjcmV0LWtleS1wYXJhLWVsLXByb3llY3RvLWFicC11MS1kaXN0cmlidWlkb3M=
  expiration-ms: 86400000

app:
  rabbitmq:
    exchange: vuelos.events
    routing-key: usuario.registrado